name: Demo CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Code quality checks

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ruff linter
        uses: astral-sh/ruff-action@v3
        with:
          src: .

  type-check:
    runs-on: ubuntu-latest
    name: Type check

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # pyright needs the project's dependencies importable to resolve types,
      # so this syncs the full environment rather than installing pyright alone.
      - name: Install dependencies
        run: uv sync --extra dev

      - name: Type-check gated modules
        run: make type-check

  test:
    runs-on: ubuntu-latest
    name: Run tests

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r dev-requirements.txt

      - name: Run tests
        run: pytest -v

  security:
    runs-on: ubuntu-latest
    name: Dependency vulnerability scan

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Verify requirements files match uv.lock
        run: |
          make deps-export
          git diff --exit-code requirements.txt dev-requirements.txt \
            || (echo "::error::requirements files are out of date - run 'make deps-export'" && exit 1)

      - name: Scan dependencies with osv-scanner
        run: make security-scan

  sast:
    runs-on: ubuntu-latest
    name: Static analysis security scan

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Pinned release binary with a checksum rather than `curl | bash`, so a
      # compromised install script cannot execute code on the runner.
      - name: Install opengrep
        env:
          OPENGREP_VERSION: v1.26.0
          OPENGREP_SHA256: 40c21299eeddabf743b856daa843d24f9d4a027130671cd45b3b21776fd9ab26
        run: |
          mkdir -p "$HOME/.opengrep/cli/latest"
          curl -fsSL -o "$HOME/.opengrep/cli/latest/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_SHA256}  $HOME/.opengrep/cli/latest/opengrep" | sha256sum --check --strict
          chmod +x "$HOME/.opengrep/cli/latest/opengrep"
          echo "$HOME/.opengrep/cli/latest" >> "$GITHUB_PATH"

      - name: Verify opengrep is runnable
        run: opengrep --version

      - name: Scan source with opengrep
        run: make sast-scan

  image-tag:
    name: Generate Image Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Generate tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="${SHORT_SHA}-$(date +%s)"
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "Generated tag: '$TAG'"

  docker-build:
    runs-on: ubuntu-latest
    name: Build and push image
    needs: [lint, type-check, test, image-tag]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Skipped on PRs: fork PRs get a read-only GITHUB_TOKEN, so this would fail.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/eggai-tech/eggai-demo:${{ needs.image-tag.outputs.tag }}
            ghcr.io/eggai-tech/eggai-demo:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  review:
    runs-on: ubuntu-latest
    name: AI Code Review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install QualOps
        run: npm install -g @eggai/qualops@~0.2

      - name: Run QualOps
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through the environment rather than interpolated into the
          # shell command: `${{ ... }}` is substituted before the shell runs, so
          # a crafted ref name would otherwise be executed as shell code.
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.sha }}
        run: qualops --base="$BASE_REF" --head="$HEAD_SHA"

      - name: Upload QualOps report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualops-report
          path: .qualops/reports/
          retention-days: 30
