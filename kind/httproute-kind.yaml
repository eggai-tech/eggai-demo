---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: eggai-demo
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: eggai-demo
  hostnames:
    - chat.eggai.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: eggai
          port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redpanda-console
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: eggai-demo
  hostnames:
    - redpanda.eggai.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: redpanda-console
          port: 8080
