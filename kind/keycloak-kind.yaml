apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: {app: keycloak}
  template:
    metadata:
      labels: {app: keycloak}
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.7.0
        args: ["start-dev", "--import-realm"]
        env:
        - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
        - {name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: admin}
        - {name: KC_HTTP_PORT, value: "8080"}
        - {name: KC_HEALTH_ENABLED, value: "true"}
        - {name: KC_HOSTNAME, value: http://keycloak.eggai.localhost}
        - {name: INSURANCE_WEB_URL, value: http://chat.eggai.localhost}
        - {name: INSURANCE_FRONTEND_CLIENT_SECRET, value: dev-frontend-secret}
        - {name: INSURANCE_TRIAGE_CLIENT_SECRET, value: dev-triage-secret}
        - {name: INSURANCE_USER_PASSWORD, value: insurance}
        ports:
        - {name: http, containerPort: 8080}
        - {name: management, containerPort: 9000}
        volumeMounts:
        - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
        readinessProbe:
          httpGet: {path: /health/ready, port: 9000}
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests: {cpu: 100m, memory: 512Mi}
          limits:   {memory: 1Gi}
      volumes:
      - name: realm
        configMap: {name: keycloak-realm}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: {app: keycloak}
  ports:
  - {name: http, port: 8080, targetPort: 8080}
