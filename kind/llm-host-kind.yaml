apiVersion: v1
kind: Service
metadata:
  name: llm
  labels: {app: llm}
spec:
  ports:
  - {name: http, port: 1234, targetPort: 1234}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: llm-host
  labels: {kubernetes.io/service-name: llm, app: llm}
addressType: IPv4
ports: [{name: http, port: 1234, protocol: TCP}]
endpoints:
- addresses: ["__HOST_IP__"]