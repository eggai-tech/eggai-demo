fullnameOverride: eggai
resources:
  limits:   {cpu: "1",   memory: "768Mi"}
  requests: {cpu: "50m", memory: "256Mi"}

globalEnv:
  KAFKA_BOOTSTRAP_SERVERS: "redpanda:9093"
  LANGUAGE_MODEL: "lm_studio/google/gemma-3-4b"
  LANGUAGE_MODEL_API_BASE: "http://llm:1234/v1"

extraEnv:
  - name: OPENAI_API_KEY
    value: "ollama"
  - name: DEPLOYMENT_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace

agents:
  frontend:
    environment:
      - { name: FRONTEND_HOST, value: "0.0.0.0" }
      - { name: FRONTEND_KEYCLOAK_CLIENT_ID, value: insurance-frontend }
      - { name: FRONTEND_KEYCLOAK_CLIENT_SECRET, value: dev-frontend-secret }
      - { name: FRONTEND_KEYCLOAK_PUBLIC_URL, value: http://keycloak.eggai.localhost }
  triage:
    environment:
      - { name: TRIAGE_CLASSIFIER_VERSION, value: v4 }
      - { name: TRIAGE_KEYCLOAK_CLIENT_ID, value: insurance-triage }
      - { name: TRIAGE_KEYCLOAK_CLIENT_SECRET, value: dev-triage-secret }
  policies:
    enabled: true
    resources:
      limits: { cpu: "1",    memory: "3Gi" }
      requests: { cpu: "500m", memory: "1Gi" }
    environment:
      - { name: POLICIES_KEYCLOAK_CLIENT_ID, value: insurance-policies }
      - { name: POLICIES_KEYCLOAK_CLIENT_SECRET, value: dev-policies-secret }
  billing:
    environment:
      - { name: BILLING_KEYCLOAK_CLIENT_ID, value: insurance-billing }
      - { name: BILLING_KEYCLOAK_CLIENT_SECRET, value: dev-billing-secret }
  claims:
    environment:
      - { name: CLAIMS_KEYCLOAK_CLIENT_ID, value: insurance-claims }
      - { name: CLAIMS_KEYCLOAK_CLIENT_SECRET, value: dev-claims-secret }
  escalation:
    environment:
      - { name: ESCALATION_KEYCLOAK_CLIENT_ID, value: insurance-escalation }
      - { name: ESCALATION_KEYCLOAK_CLIENT_SECRET, value: dev-escalation-secret }
  policiesDocumentIngestion: {enabled: false}
