# kube-prom-keycloak-kind.yaml: Grafana logs in through the Keycloak realm "insurance". Applied on top of
# kube-prom-kind.yaml when KIND_KEYCLOAK=true. The browser goes to the public Keycloak host, Grafana itself
# talks to the in-cluster Service. alice (realm role insurance-admin) is Grafana Admin, everyone else Viewer.
# The local admin (admin/admin) keeps working for the HTTP API over basic auth. The chart refuses secrets inside
# grafana.ini, so the client secret goes in as the matching GF_ env var.
grafana:
  env:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: dev-grafana-secret
  grafana.ini:
    server:
      root_url: http://grafana.eggai.localhost
    auth:
      disable_login_form: true
      signout_redirect_url: http://keycloak.eggai.localhost/realms/insurance/protocol/openid-connect/logout?client_id=insurance-grafana&post_logout_redirect_uri=http%3A%2F%2Fgrafana.eggai.localhost%2Flogin
    auth.anonymous:
      enabled: false
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      auto_login: true
      client_id: insurance-grafana
      scopes: openid profile
      use_pkce: true
      auth_url: http://keycloak.eggai.localhost/realms/insurance/protocol/openid-connect/auth
      token_url: http://keycloak.eggai-demo.svc.cluster.local:8080/realms/insurance/protocol/openid-connect/token
      api_url: http://keycloak.eggai-demo.svc.cluster.local:8080/realms/insurance/protocol/openid-connect/userinfo
      login_attribute_path: preferred_username
      name_attribute_path: name
      email_attribute_path: email
      role_attribute_path: contains(roles[*], 'insurance-admin') && 'Admin' || 'Viewer'
