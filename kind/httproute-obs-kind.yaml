apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: eggai-demo
  hostnames:
    - grafana.eggai.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kube-prom-grafana
          port: 80