# temporal-kind.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
spec:
  replicas: 1
  strategy:
    type: Recreate            # RWO volume; rolling update would deadlock on the mount
  selector:
    matchLabels: {app: temporal}
  template:
    metadata:
      labels: {app: temporal}
    spec:
      securityContext:
        fsGroup: 1000         # image runs as uid 1000; local-path dirs come up root-owned
      containers:
      - name: temporal
        image: temporalio/temporal:1.4.1      # CLI image; entrypoint is `temporal`
        args:
          - server
          - start-dev
          - --ip=0.0.0.0
          - --db-filename=/data/temporal.db
          - --namespace=default
          - --log-level=warn
        ports:
        - {name: grpc, containerPort: 7233}
        - {name: ui,   containerPort: 8233}
        volumeMounts:
        - {name: data, mountPath: /data}
        readinessProbe:
          exec:
            command: ["temporal","operator","cluster","health","--address","127.0.0.1:7233"]
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket: {port: 7233}
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests: {cpu: 50m, memory: 256Mi}
          limits:   {memory: 1Gi}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: temporal-data}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend           # matches the SKE DNS name; only the namespace differs
spec:
  selector: {app: temporal}
  ports:
  - {name: grpc, port: 7233, targetPort: 7233}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
spec:
  selector: {app: temporal}
  ports:
  - {name: http, port: 8233, targetPort: 8233}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: temporal-ui
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: eggai-demo
  hostnames:
    - temporal.eggai.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: temporal-ui
          port: 8233
