# helm repo add grafana https://grafana.github.io/helm-charts
# chart: grafana/tempo
fullnameOverride: tempo

tempo:
  retention: 24h
  storage:
    trace:
      backend: local
      local:  {path: /var/tempo/traces}
      wal:    {path: /var/tempo/wal}
  # The collector is the only thing writing here, so OTLP only.
  receivers:
    otlp:
      protocols:
        grpc: {endpoint: 0.0.0.0:4317}
        http: {endpoint: 0.0.0.0:4318}
  # Service graphs: derives agent→agent call topology from spans.
  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://kube-prom-prometheus.observability.svc.cluster.local:9090/api/v1/write"
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits:   {memory: 1Gi}

persistence:
  enabled: true
  size: 2Gi
  storageClassName: standard

serviceMonitor:
  enabled: true