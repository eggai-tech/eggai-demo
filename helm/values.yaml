# -- Applied to EVERY agent, automatically prefixed with that agent's
# pydantic-settings env_prefix (see agentMeta in _helpers.tpl).
# Keys are the UNPREFIXED setting name, uppercased. Empty values are
# omitted entirely, so the app keeps its own default.
globalEnv:
  KAFKA_BOOTSTRAP_SERVERS: ""
  KAFKA_TOPIC_PREFIX: ""
  OTEL_ENDPOINT: ""
  TRACING_ENABLED: ""
  DEPLOYMENT_NAMESPACE: ""
  LANGUAGE_MODEL: ""
  LANGUAGE_MODEL_API_BASE: ""

# -- Verbatim env for every agent. No prefixing. Use for vars read outside
# pydantic (LiteLLM's OPENAI_API_KEY) or with a non-agent prefix
# (FEWSHOT_MLFLOW_TRACKING_URI, ATTENTION_NET_MLFLOW_TRACKING_URI).
# Supports valueFrom.
extraEnv: []

# -- envFrom for every agent. The clean way to inject API keys.
envFrom: []

# -- Agent identity at the AI gateway. When the audience is set, every agent exchanges the user's
# token with Keycloak for this audience once per run and sends it as the bearer on every model and
# tool call, with traceparent and run id. Each agent needs its Keycloak client id and secret
# (<PREFIX>KEYCLOAK_CLIENT_ID, <PREFIX>KEYCLOAK_CLIENT_SECRET) in its environment.
gateway:
  audience: ""

# -- The front door's policy decision point: an OPA sidecar in the frontend pod, on 127.0.0.1:8181,
# that the frontend asks on every user message, every reply and every admin API call. It pulls the
# signed bundles named here and sends its decision logs to the evidence service.
frontDoorPolicy:
  enabled: false
  image: openpolicyagent/opa:1.21.2-static
  # Secret with a `token` key for the bundle registry, mounted at /run/opa/registry/token.
  registryTokenSecret: ""
  # OPA configuration, rendered as is. For example:
  #   services:
  #     registry:
  #       url: https://ghcr.io
  #       type: oci
  #       credentials: {bearer: {token_path: /run/opa/registry/token}}
  #     containment:
  #       url: http://containment.example.svc.cluster.local
  #   bundles:
  #     policy: {service: registry, resource: ghcr.io/org/foundry-policy-gateway:0.1.0, signing: {keyid: policy}}
  #     binding: {service: registry, resource: ghcr.io/org/foundry-binding-org:0.1.0, signing: {keyid: binding}}
  #     containment: {service: containment, resource: /containment, signing: {keyid: containment}}
  #   keys:
  #     policy: {algorithm: ES256, key: "-----BEGIN PUBLIC KEY-----\n...\n-----END PUBLIC KEY-----"}
  services: {}
  bundles: {}
  keys: {}
  # Base URL of the evidence service that receives the decision logs.
  evidenceUrl: ""
  resources:
    limits:   {cpu: "200m", memory: "256Mi"}
    requests: {cpu: "50m",  memory: "64Mi"}

# -- Links shown in the chat header, name -> URL. List only services that have
# a route on this cluster. Empty keeps the frontend's compose defaults.
platformLinks: {}

agents:
  audit:
    enabled: true
    replicaCount: 1
    environment: []
    envFrom: []
  billing:
    enabled: true
    replicaCount: 1
    httpPort: 8004
    environment: []
    envFrom: []
  claims:
    enabled: true
    replicaCount: 1
    httpPort: 8003
    environment: []
    envFrom: []
  escalation:
    enabled: true
    replicaCount: 1
    environment: []
    envFrom: []
  frontend:
    enabled: true
    replicaCount: 1
    httpPort: 8000
    environment: []
    envFrom: []
    livenessProbe:
      httpGet: {path: /, port: http}
    readinessProbe:
      httpGet: {path: /, port: http}
  policiesDocumentIngestion:
    enabled: true
    replicaCount: 1
    environment: []
    envFrom: []
    nodeSelector: {}
    tolerations: []
  policies:
    enabled: true
    replicaCount: 1
    httpPort: 8002
    environment: []
    envFrom: []
  triage:
    enabled: true
    replicaCount: 1
    environment: []
    envFrom: []

image:
  repository: ghcr.io/eggai-tech/eggai-demo
  pullPolicy: IfNotPresent
  tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

resources:
  limits:
    cpu: "250m"
    memory: "512Mi"
    ephemeral-storage: "4Gi"
  requests:
    cpu: "100m"
    memory: "128Mi"
    ephemeral-storage: "512Mi"

cacheVolumeSize: "2Gi"

podAnnotations: {}

# -- The image runs as UID 1000 and /cache is an emptyDir, which mounts
# root:root 0755. Without fsGroup the DSPy cache is unwritable.
podSecurityContext:
  fsGroup: 1000

securityContext: {}

affinity: {}

service:
  type: ClusterIP

monitoring:
  enabled: true
  port: 9000
  serviceMonitor:
    interval: 30s
    scrapeTimeout: 10s

nodeSelector: {}
tolerations: []
