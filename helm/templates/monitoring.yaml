{{- if .Values.monitoring.enabled }}
{{- range $name, $agent := .Values.agents }}
{{- if $agent.enabled }}
{{- $meta := include "eggai-multi-agent-chat.agentMeta" $name | fromJson }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s-metrics" (include "eggai-multi-agent-chat.fullname" $) $meta.label | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "eggai-multi-agent-chat.labels" $ | nindent 4 }}
    app.kubernetes.io/component: monitoring
    egg-ai.com/agent: {{ $meta.label }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $.Values.monitoring.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "eggai-multi-agent-chat.selectorLabels" $ | nindent 4 }}
    egg-ai.com/agent: {{ $meta.label }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ printf "%s-%s" (include "eggai-multi-agent-chat.fullname" $) $meta.label | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "eggai-multi-agent-chat.labels" $ | nindent 4 }}
spec:
  endpoints:
  - honorLabels: true
    interval: {{ $.Values.monitoring.serviceMonitor.interval | default "30s" }}
    path: /metrics
    port: metrics
    scheme: http
    scrapeTimeout: {{ $.Values.monitoring.serviceMonitor.scrapeTimeout | default "10s" }}
  selector:
    matchLabels:
      {{- include "eggai-multi-agent-chat.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: monitoring
      egg-ai.com/agent: {{ $meta.label }}
{{- end }}
{{- end }}
{{- end }}