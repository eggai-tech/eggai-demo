{{- range $name, $agent := .Values.agents }}
{{- if $agent.enabled }}
{{- $meta := include "eggai-multi-agent-chat.agentMeta" $name | fromJson }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eggai-multi-agent-chat.fullname" $ }}-{{ $meta.label }}
  labels:
    {{- include "eggai-multi-agent-chat.labels" $ | nindent 4 }}
spec:
  replicas: {{ $agent.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "eggai-multi-agent-chat.selectorLabels" $ | nindent 6 }}
      egg-ai.com/agent: {{ $meta.label }}
  template:
    metadata:
      {{- with $.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "eggai-multi-agent-chat.selectorLabels" $ | nindent 8 }}
        egg-ai.com/agent: {{ $meta.label }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $.Chart.Name }}
          args:
          - {{ $meta.module }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            {{- include "eggai-multi-agent-chat.agentEnv" (dict "root" $ "agent" $name) | nindent 12 }}
          {{- with (concat ($.Values.envFrom | default list) ($agent.envFrom | default list)) }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            {{- if $agent.httpPort }}
            - name: http
              containerPort: {{ $.Values.service.port }}
              protocol: TCP
            {{- end }}
            {{- if $.Values.monitoring.enabled }}
            - name: metrics
              containerPort: {{ $.Values.monitoring.port }}
              protocol: TCP
            {{- end }}
          {{- with $agent.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $agent.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
          - mountPath: /cache
            name: cache
          {{- with $agent.extraVolumeMounts }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          resources:
            {{- toYaml ($agent.resources | default $.Values.resources) | nindent 12 }}
      volumes:
      - emptyDir:
          sizeLimit: {{ $agent.cacheVolumeSize | default $.Values.cacheVolumeSize }}
        name: cache
      {{- with $agent.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with ($agent.nodeSelector | default $.Values.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with ($agent.tolerations | default $.Values.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}