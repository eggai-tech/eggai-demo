{{- range $name, $agent := .Values.agents }}
{{- if $agent.enabled }}
{{- $meta := include "eggai-multi-agent-chat.agentMeta" $name | fromJson }}
{{- $frontDoor := and (eq $name "frontend") $.Values.frontDoorPolicy.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eggai-multi-agent-chat.fullname" $ }}-{{ $meta.label }}
  labels:
    {{- include "eggai-multi-agent-chat.labels" $ | nindent 4 }}
spec:
  replicas: {{ $agent.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "eggai-multi-agent-chat.selectorLabels" $ | nindent 6 }}
      egg-ai.com/agent: {{ $meta.label }}
  template:
    metadata:
      {{- if or $.Values.podAnnotations $frontDoor }}
      annotations:
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $frontDoor }}
        checksum/frontdoor-opa: {{ include (print $.Template.BasePath "/frontdoor-opa.yaml") $ | sha256sum }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "eggai-multi-agent-chat.selectorLabels" $ | nindent 8 }}
        egg-ai.com/agent: {{ $meta.label }}
    spec:
      serviceAccountName: {{ include "eggai-multi-agent-chat.serviceAccountName" (dict "root" $ "agent" $name) }}
      automountServiceAccountToken: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- if $frontDoor }}
      {{- with $.Values.frontDoorPolicy }}
      initContainers:
        # Native sidecar: the frontend starts once OPA has activated its signed bundles.
        - name: opa
          image: {{ .image }}
          restartPolicy: Always
          args:
            - run
            - --server
            - --addr=127.0.0.1:8181
            - --diagnostic-addr=0.0.0.0:8282
            - --config-file=/config/opa/config.yaml
            - --skip-version-check
            - --log-format=json
          ports:
            - name: opa-health
              containerPort: 8282
              protocol: TCP
          startupProbe:
            httpGet: {path: "/health?bundles", port: opa-health}
            periodSeconds: 2
            failureThreshold: 150
          readinessProbe:
            httpGet: {path: "/health?bundles", port: opa-health}
          livenessProbe:
            httpGet: {path: /health, port: opa-health}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: opa-config
              mountPath: /config/opa
              readOnly: true
            # The OCI downloader unpacks each bundle under a temporary directory.
            - name: opa-tmp
              mountPath: /tmp
            {{- if .registryTokenSecret }}
            - name: opa-registry
              mountPath: /run/opa/registry
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .resources | nindent 12 }}
      {{- end }}
      {{- end }}
      containers:
        - name: {{ $.Chart.Name }}
          args:
          - {{ $meta.module }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            {{- include "eggai-multi-agent-chat.agentEnv" (dict "root" $ "agent" $name) | nindent 12 }}
          {{- with (concat ($.Values.envFrom | default list) ($agent.envFrom | default list)) }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            {{- if $agent.httpPort }}
            - name: http
              containerPort: {{ $agent.httpPort }}
              protocol: TCP
            {{- end }}
            {{- if $.Values.monitoring.enabled }}
            - name: metrics
              containerPort: {{ $.Values.monitoring.port }}
              protocol: TCP
            {{- end }}
          {{- with $agent.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $agent.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
          - mountPath: /cache
            name: cache
          {{- with $agent.extraVolumeMounts }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          resources:
            {{- toYaml ($agent.resources | default $.Values.resources) | nindent 12 }}
      volumes:
      - emptyDir:
          sizeLimit: {{ $agent.cacheVolumeSize | default $.Values.cacheVolumeSize }}
        name: cache
      {{- if $frontDoor }}
      - name: opa-config
        configMap:
          name: {{ include "eggai-multi-agent-chat.fullname" $ }}-frontdoor-opa
      - name: opa-tmp
        emptyDir:
          sizeLimit: 64Mi
      {{- with $.Values.frontDoorPolicy.registryTokenSecret }}
      - name: opa-registry
        secret:
          secretName: {{ . }}
      {{- end }}
      {{- end }}
      {{- with $agent.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with ($agent.nodeSelector | default $.Values.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with ($agent.tolerations | default $.Values.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}