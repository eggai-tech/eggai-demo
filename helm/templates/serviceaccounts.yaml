{{- range $name, $agent := .Values.agents }}
{{- if $agent.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "eggai-multi-agent-chat.serviceAccountName" (dict "root" $ "agent" $name) }}
  labels:
    {{- include "eggai-multi-agent-chat.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
